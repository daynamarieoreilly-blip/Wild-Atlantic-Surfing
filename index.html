
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlantic Edge — Session Desk</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf5f6;color:#103742;font:16px system-ui,Arial}
.wrap{max-width:650px;margin:auto;padding-bottom:110px}
header{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,#062f44,#086578);color:white;padding:28px 18px 65px;min-height:218px}
header>*{position:relative;z-index:2}
header h1{margin:4px 0;font-size:32px;letter-spacing:-.7px}
header small{color:#bfe9e8;font-weight:800;letter-spacing:1px}
.sample{display:inline-block;margin-top:12px;background:#fff0bc;color:#654500;border-radius:8px;padding:8px;font-weight:800;font-size:12px}
main{padding:18px 14px}
h2{margin:0 0 4px;font-size:25px}
h3{margin:0 0 8px}
.sub{color:#57717a;font-size:14px;margin:0 0 16px}
.card{background:white;border:1px solid #d2e3e6;border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #10374212}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:#d8f5e9;color:#065b47;padding:6px 9px;border-radius:99px;font-size:12px;font-weight:850;white-space:nowrap}
.red{background:#ffe3e3;color:#9d1b26}
.amber{background:#fff0cd;color:#855400}
.overdue{border:2px solid #b92834;background:#fff8f8}
.muted{font-size:14px;color:#58717a;line-height:1.6}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:72px;border:0;border-radius:13px;margin-top:14px;padding:15px;font-size:18px;font-weight:850;text-decoration:none;touch-action:manipulation;cursor:pointer}
.primary{background:#006c73;color:white}
.danger{background:#a92335;color:white}
.secondary{background:#e2f1f3;color:#07535c}
.btn:disabled{background:#e6eeee;color:#6a8287}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #cfdee1;padding:8px 10px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -4px 22px #063d5020}
.tabs{max-width:650px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabs button{border:0;border-radius:13px;background:#e8f2f3;min-height:76px;font-size:16px;font-weight:850;color:#365e65}
.tabs button.active{background:#073d50;color:white}
.tabs span{display:block;font-size:23px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats .card{margin:0}
.number{font-size:30px;font-weight:900}
.slot{border:1px solid #d0e0e3;border-radius:12px;padding:12px;margin:9px 0;background:#f7fbfb}
.empty{text-align:center;background:white;padding:30px 15px;border-radius:15px}
.shade{position:fixed;inset:0;background:#062e3cc7;display:flex;align-items:end;justify-content:center;z-index:10}
.dialog{width:min(650px,100%);background:white;padding:23px 16px calc(20px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0}
.hide{display:none}
.reset{border:1px solid #aac8cc;border-radius:9px;background:white;padding:12px;font:inherit}
.wave-art{position:absolute;z-index:0;left:0;right:0;bottom:-2px;width:100%;height:104px;pointer-events:none;opacity:.95}
.wave-art .wave-back{animation:swell 9s ease-in-out infinite alternate;transform-origin:center bottom}
.wave-art .wave-front{animation:swell 6s ease-in-out infinite alternate-reverse;transform-origin:center bottom}
@keyframes swell{
from{transform:translateX(-12px) translateY(4px)}
to{transform:translateX(12px) translateY(-4px)}
}
body{background:linear-gradient(180deg,#d7eff1 0%,#edf5f6 430px,#edf5f6 100%)}
.btn:active,.tabs button:active{transform:scale(.985)}
.btn,.tabs button{transition:transform .12s ease}
@media(prefers-reduced-motion:reduce){
.wave-art .wave-back,.wave-art .wave-front{animation:none}
.btn,.tabs button{transition:none}
}
button:focus-visible,a:focus-visible{outline:4px solid #f0b532;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<header>
<small>ATLANTIC EDGE · LAHINCH, CO. CLARE</small>
<h1>Session Desk</h1>
<div>Four-day lesson planner · fast rebooking.</div>
<div class="sample">DEMO · FICTIONAL SAMPLE DATA</div>
<svg class="wave-art" viewBox="0 0 650 110" preserveAspectRatio="none" aria-hidden="true" focusable="false">
<path class="wave-back" fill="#35a6ac" opacity=".45" d="M-30 44 C 65 5,155 80,245 44 S 425 5,525 44 S 680 75,710 42 L710 120 L-30 120 Z"/>
<path class="wave-front" fill="#83d5d5" opacity=".7" d="M-30 66 C 70 25,165 102,270 63 S 475 30,575 68 S 685 86,710 62 L710 120 L-30 120 Z"/>
<path fill="#d7eff1" d="M-30 92 C 75 68,155 114,270 90 S 470 70,570 92 S 675 105,710 87 L710 120 L-30 120 Z"/>
</svg>
</header>
<main id="app"></main>
</div>

<nav class="nav">
<div class="tabs">
<button id="todayTab" onclick="show('today')"><span>☀</span>Bookings</button>
<button id="rebookTab" onclick="show('rebook')"><span>↻</span>Rebook <b id="count"></b></button>
<button id="moneyTab" onclick="show('money')"><span>€</span>Money</button>
</div>
</nav>

<div id="modal" class="shade hide" role="dialog" aria-modal="true"></div>

<script>
const KEY='atlantic-edge-ca2-demo-v2',PRICE=45,MAX=12;

function date(n=0){
let d=new Date();
d.setHours(12,0,0,0);
d.setDate(d.getDate()+n);
return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')
}

function pretty(d){
return new Date(d+'T12:00:00').toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'})
}

function seed(){
let sessions=[];
for(let day=0;day<4;day++)
for(let i=0;i<6;i++)
sessions.push({
id:`s${day}_${i}`,
date:date(day),
time:['09:00','10:30','12:00','13:30','15:00','16:30'][i],
instructor:['Aoife','Conor','Maeve','Dara','Finn'][(i+day)%5],
cancelled:false
});
let raw=[
['Emma Walsh',2,'s0_0'],
['Liam O’Brien',4,'s0_0'],
['Sarah Murphy',3,'s0_1'],
['Jack Kelly',2,'s0_2'],
['Nora Byrne',5,'s0_3'],
['Daniel Ryan',4,'s0_4'],
['Grace Collins',3,'s0_5'],
['Ben Fitzgerald',2,'s1_0'],
['Chloe McCarthy',4,'s1_1'],
['Patrick Nolan',3,'s1_2'],
['Ava Doyle',2,'s1_3'],
['Oliver Hayes',3,'s1_4']
];
return {
sessions,
bookings:raw.map((r,i)=>({
id:'b'+i,
name:r[0],
size:r[1],
sessionId:r[2],
contact:`sample${i+1}@example.com`,
phone:`087 000 ${String(1000+i)}`,
...(r[2]===null?{waitingSince:new Date(Date.now()-(i===10?55:18)*3600000).toISOString()}:{})
}))
}
}

let data;
try{
data=JSON.parse(localStorage.getItem(KEY));
if(!data||!Array.isArray(data.bookings)||!Array.isArray(data.sessions))throw Error()
}catch(e){data=seed()}
let page='today';

function save(){
try{localStorage.setItem(KEY,JSON.stringify(data))}
catch(e){alert('Browser storage is unavailable. Changes may not save.')}
}

const byId=id=>data.sessions.find(s=>s.id===id),
booked=id=>data.bookings.filter(b=>b.sessionId===id),
used=id=>booked(id).reduce((n,b)=>n+b.size,0),
pending=()=>data.bookings.filter(b=>b.sessionId===null).sort((a,b)=>a.waitingSince.localeCompare(b.waitingSince)),
late=b=>Date.now()-new Date(b.waitingSince)>=48*3600000,
eur=n=>'€'+n.toLocaleString('en-IE'),
esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function options(b){
return data.sessions
.filter(s=>!s.cancelled&&s.date>=date()&&new Date(s.date+'T'+s.time)>new Date()&&MAX-used(s.id)>=b.size)
.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))
.slice(0,3)
}

function show(p){
page=p;
document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.id===p+'Tab'));
document.getElementById('count').textContent=pending().length?`(${pending().length})`:'';
document.getElementById('app').innerHTML=p==='today'?today():p==='rebook'?rebook():money();
window.scrollTo(0,0)
}

function today(){
return `<h2>Bookings · next 4 days</h2>
<p class="sub">Tap Rebook beside a customer to save them to the follow-up list. Cancel entire session only when the lesson cannot go ahead.</p>`+
[0,1,2,3].map(day=>
`<h3 style="margin-top:24px">${pretty(date(day))}</h3>`+
data.sessions.filter(s=>s.date===date(day)).map(s=>
`<section class="card">
<div class="line">
<h3>${s.time} · Surf lesson</h3>
<span class="pill ${s.cancelled?'red':''}">${s.cancelled?'Cancelled':MAX-used(s.id)+' room left'}</span>
</div>
<p class="muted">Instructor: ${esc(s.instructor)} · ${used(s.id)}/12 places</p>
${booked(s.id).map(b=>
`<div class="slot">
<strong>${esc(b.name)}</strong>
<p class="muted">${b.size} people · ${esc(b.phone)} · ${esc(b.contact)}</p>
<button class="btn primary" onclick="queueBooking('${b.id}')">↻ Rebook customer</button>
</div>`).join('')||'<p class="muted">No confirmed customers</p>'}
<button class="btn ${s.cancelled?'secondary':'danger'}" ${s.cancelled?'disabled':''} onclick="askCancel('${s.id}')">${s.cancelled?'Session cancelled':'Cancel entire session'}</button>
</section>`).join('')).join('')+
`<p class="sub">All customer details are fictional sample data.</p>`
}

function queueBooking(id){
let b=data.bookings.find(x=>x.id===id);
if(!b||!b.sessionId)return;
b.sessionId=null;
b.waitingSince=new Date().toISOString();
save();
show('rebook')
}

function rebook(){
let list=pending();
return `<h2>Rebook · follow-up list</h2>
<p class="sub">Customers appear here only after you tap Rebook or cancel their session. Saved even if you get distracted.</p>
<section class="card"><strong>${list.length} waiting</strong><p class="muted">Amber until 48 hours; red afterwards.</p></section>`+
(list.length?list.map(b=>
`<section class="card ${late(b)?'overdue':''}">
<div class="line">
<h3>${esc(b.name)}</h3>
<span class="pill ${late(b)?'red':'amber'}">${late(b)?'RED · 48h+':'AMBER'}</span>
</div>
<p class="muted">${b.size} people · ${eur(b.size*PRICE)} at risk<br>${esc(b.contact)} · ${esc(b.phone)}</p>
<button class="btn secondary" onclick="notifyCustomer('${b.id}','cancel')">✉ Prepare customer email</button>
<h4>Next three sessions with enough room</h4>
${options(b).map(s=>
`<div class="slot">
<div class="line">
<strong>${pretty(s.date)} · ${s.time}</strong>
<span class="pill">${MAX-used(s.id)} left</span>
</div>
<button class="btn primary" onclick="askRebook('${b.id}','${s.id}')">Rebook here</button>
</div>`).join('')||'<p class="muted">No suitable sessions currently available.</p>'}
</section>`).join(''):'<div class="empty">No customers need rebooking.</div>')
}

function changeBooking(bid){
let b=data.bookings.find(x=>x.id===bid);
if(!b||!b.sessionId)return;
let original=byId(b.sessionId);
let choices=options(b).filter(s=>s.id!==original.id);
dialog('Change booking',`Choose a new lesson for ${esc(b.name)} (${b.size} people). The current booking stays confirmed until you choose.`,choices.map(s=>`<button class="btn primary" onclick="askChange('${bid}','${s.id}')">${pretty(s.date)} · ${s.time} (${MAX-used(s.id)} free)</button>`).join('')||'<p>No other suitable sessions available.</p>')
}

function askChange(bid,sid){
let b=data.bookings.find(x=>x.id===bid),s=byId(sid);
if(!b||!b.sessionId||!options(b).some(x=>x.id===sid))return;
dialog('Confirm booking change?',`${esc(b.name)} (${b.size} people) → ${pretty(s.date)} ${s.time}`,`<button class="btn primary" onclick="confirmChange('${bid}','${sid}')">Confirm new session</button>`)
}

function confirmChange(bid,sid){
let b=data.bookings.find(x=>x.id===bid),s=byId(sid);
if(!b||!b.sessionId||!options(b).some(x=>x.id===sid))return;
b.sessionId=sid;
save();
closeDialog();
show('rebook');
dialog('Booking updated',`${esc(b.name)} has moved to ${pretty(s.date)} at ${s.time}.`, `<button class="btn primary" onclick="closeDialog();notifyCustomer('${bid}','confirm')">✉ Prepare confirmation email</button>`)
}

function money(){
let list=pending(),people=list.reduce((n,b)=>n+b.size,0);
return `<h2>Money</h2>
<p class="sub">Outstanding bookings and potential revenue at risk</p>
<div class="stats">
<div class="card"><div class="muted">Bookings waiting</div><div class="number">${list.length}</div></div>
<div class="card"><div class="muted">Value at risk</div><div class="number">${eur(people*PRICE)}</div></div>
<div class="card"><div class="muted">People waiting</div><div class="number">${people}</div></div>
<div class="card"><div class="muted">Red · over 48h</div><div class="number">${list.filter(late).length}</div></div>
</div>
<section class="card">
<h3>Calculation</h3>
<p>${people} people × €45 per lesson = <strong>${eur(people*PRICE)}</strong>.</p>
<p class="muted">At risk is not confirmed lost revenue. The total updates immediately after cancellations and rebookings.</p>
<button class="btn primary" onclick="show('rebook')">View bookings</button>
</section>
<section class="card">
<h3>Demo controls</h3>
<p class="muted">Restore all fictional sample data to repeat the demo.</p>
<button class="reset" onclick="askReset()">Reset sample data</button>
</section>`
}

function dialog(title,body,buttons){
let el=document.getElementById('modal');
el.innerHTML=`<div class="dialog"><h2>${title}</h2><p>${body}</p>${buttons}<button class="btn secondary" onclick="closeDialog()">Back</button></div>`;
el.classList.remove('hide')
}

function closeDialog(){
document.getElementById('modal').classList.add('hide')
}

function askCancel(id){
let s=byId(id);
if(!s||s.cancelled)return;
dialog('Cancel this session?',`${pretty(s.date)} ${s.time}: ${booked(id).length} booking(s), ${used(id)} people will move to Needs rebooking.`,`<button class="btn danger" onclick="cancel('${id}')">Confirm cancellation</button>`)
}

function cancel(id){
let s=byId(id);
if(!s||s.cancelled)return;
s.cancelled=true;
let now=new Date().toISOString();
booked(id).forEach(b=>{
b.sessionId=null;
b.waitingSince=now
});
save();
closeDialog();
show('rebook')
}

function askRebook(bid,sid){
let b=data.bookings.find(b=>b.id===bid),s=byId(sid);
if(!b||!options(b).some(x=>x.id===sid))return alert('Session unavailable');
dialog('Confirm rebooking?',`${esc(b.name)} (${b.size} people) → ${pretty(s.date)} ${s.time}`,`<button class="btn primary" onclick="move('${bid}','${sid}')">Confirm rebooking</button>`)
}

function move(bid,sid){
let b=data.bookings.find(b=>b.id===bid),s=byId(sid);
if(!b||b.sessionId!==null||!options(b).some(x=>x.id===sid))return closeDialog();
b.sessionId=sid;
delete b.waitingSince;
save();
closeDialog();
show('rebook');
dialog('Booking saved',`${esc(b.name)} is now booked for ${pretty(s.date)} at ${s.time}. Prepare a confirmation email?`,`<button class="btn primary" onclick="closeDialog();notifyCustomer('${bid}','confirm')">✉ Prepare confirmation</button>`)
}

function notifyCustomer(bid,type){
let b=data.bookings.find(x=>x.id===bid);
if(!b)return;
let s=byId(b.sessionId),
subject=type==='cancel'?'Atlantic Edge lesson cancellation':'Atlantic Edge lesson confirmation',
body=type==='cancel'
?`Hi ${b.name},\n\nYour Atlantic Edge lesson has been cancelled due to weather or surf conditions. We will contact you to arrange another session.\n\nAtlantic Edge Surf School`
:`Hi ${b.name},\n\nYour lesson for ${b.size} people is confirmed for ${pretty(s.date)} at ${s.time}.\n\nAtlantic Edge Surf School`;
let link=`mailto:${encodeURIComponent(b.contact)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
dialog('Customer notification',`Open a prepared email to ${esc(b.contact)}. <strong>Staff must review and send it; the app does not send automatically.</strong>`,`<a class="btn primary" href="${link}" onclick="closeDialog()">Open email draft</a>`)
}

function askReset(){
dialog('Reset demo?',`Replace your saved changes with the original fictional records?`,`<button class="btn danger" onclick="data=seed();save();closeDialog();show('today')">Reset sample data</button>`)
}

show('today');
</script>
</body>
</html>
